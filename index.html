<!DOCTYPE html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculator - Modern UI</title>
    <style>
      :root {
        --primary-color: #4f46e5;
        --secondary-color: #818cf8;
        --accent-color: #ef4444;
        --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        --card-bg: rgba(255, 255, 255, 0.95);
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: var(--bg-gradient);
        font-family: "Kantumruy Pro", sans-serif;
        color: #1f2937;
      }

      .container {
        background: var(--card-bg);
        border-radius: 24px;
        padding: 40px 30px;
        max-width: 480px;
        width: 90%;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.8);
      }

      .title {
        margin: 0;
        font-size: 2rem;
        background: linear-gradient(
          to right,
          var(--primary-color),
          var(--secondary-color)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 700;
      }

      .subtitle {
        color: #6b7280;
        margin: 10px 0 30px;
        font-weight: 400;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-bottom: 30px;
      }

      .input-group label {
        text-align: left;
        font-size: 0.9rem;
        font-weight: 600;
        color: #4b5563;
        margin-left: 5px;
      }

      .date-picker {
        padding: 14px;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        font-family: inherit;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.3s;
      }

      .date-picker:focus {
        border-color: var(--primary-color);
      }

      .calculate-btn {
        font-family: "Kantumruy Pro", sans-serif;
        background: var(--primary-color);
        color: white;
        border: none;
        padding: 16px;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      }

      .calculate-btn:hover {
        background: #4338ca;
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(79, 70, 229, 0.4);
      }

      .calculate-btn:active {
        transform: translateY(0);
      }

      .status-message {
        margin: 20px 0;
        font-weight: 500;
        min-height: 24px;
      }

      .result-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 20px;
      }

      /* Responsive for mobile - 2 columns */
      @media (max-width: 400px) {
        .result-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .result-item {
        background: #f8fafc;
        padding: 15px 10px;
        border-radius: 16px;
        border: 1px solid #f1f5f9;
        transition: transform 0.3s;
      }

      .result-item:hover {
        transform: scale(1.05);
      }

      .result-item .value {
        display: block;
        font-size: 1.6rem;
        font-weight: 800;
        color: var(--primary-color);
        margin-bottom: 2px;
      }

      .result-item .label {
        font-size: 0.8rem;
        color: #64748b;
        font-weight: 600;
      }

      footer {
        margin-top: 40px;
        font-size: 0.85rem;
        color: #94a3b8;
        border-top: 1px solid #f1f5f9;
        padding-top: 20px;
      }

      /* Animation for values */
      @keyframes pop {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }
      .anim-pop {
        animation: pop 0.3s ease-in-out;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="title">គណនាអាយុ</h1>
      <p class="subtitle">ដឹងពីអាយុរបស់អ្នកយ៉ាងលម្អិត</p>

      <div class="input-group">
        <label for="dob">ថ្ងៃខែឆ្នាំកំណើត</label>
        <input type="date" id="dob" class="date-picker" />
        <button class="calculate-btn" id="calculateBtn">គណនាឥឡូវនេះ</button>
      </div>

      <div id="statusMsg" class="status-message">សូមជ្រើសរើសថ្ងៃកំណើត</div>

      <div id="resultContainer" style="display: none">
        <div class="result-grid">
          <div class="result-item">
            <span class="value" id="resYears">0</span
            ><span class="label">ឆ្នាំ</span>
          </div>
          <div class="result-item">
            <span class="value" id="resMonths">0</span
            ><span class="label">ខែ</span>
          </div>
          <div class="result-item">
            <span class="value" id="resDays">0</span
            ><span class="label">ថ្ងៃ</span>
          </div>
          <div class="result-item">
            <span class="value" id="resHours">0</span
            ><span class="label">ម៉ោង</span>
          </div>
          <div class="result-item">
            <span class="value" id="resMinutes">0</span
            ><span class="label">នាទី</span>
          </div>
          <div class="result-item">
            <span class="value" id="resSeconds">0</span
            ><span class="label">វិនាទី</span>
          </div>
        </div>
      </div>

      <footer>&copy; បង្កើតដោយ ៖ រ៉ា ភារៈ</footer>
    </div>

    <script>
      let updateTimer;
      const dobInput = document.getElementById("dob");
      const calculateBtn = document.getElementById("calculateBtn");
      const resultContainer = document.getElementById("resultContainer");
      const statusMsg = document.getElementById("statusMsg");

      function calculateAge() {
        const birthDateValue = dobInput.value;
        if (!birthDateValue) return;

        const birthDate = new Date(birthDateValue);
        const now = new Date();

        if (birthDate > now) {
          statusMsg.innerText = "ថ្ងៃខែឆ្នាំមិនអាចលើសពីថ្ងៃបច្ចុប្បន្នទេ!";
          statusMsg.style.color = "#ef4444";
          resultContainer.style.display = "none";
          clearInterval(updateTimer);
          return;
        }

        statusMsg.innerText = "អាយុបច្ចុប្បន្នរបស់អ្នកគឺ៖";
        statusMsg.style.color = "#4b5563";
        resultContainer.style.display = "block";

        let years = now.getFullYear() - birthDate.getFullYear();
        let months = now.getMonth() - birthDate.getMonth();
        let days = now.getDate() - birthDate.getDate();

        if (days < 0) {
          months--;
          const lastMonth = new Date(now.getFullYear(), now.getMonth(), 0);
          days += lastMonth.getDate();
        }

        if (months < 0) {
          years--;
          months += 12;
        }

        updateValue("resYears", years);
        updateValue("resMonths", months);
        updateValue("resDays", days);
        updateValue("resHours", now.getHours());
        updateValue("resMinutes", now.getMinutes());
        updateValue("resSeconds", now.getSeconds());
      }

      function updateValue(id, val) {
        const el = document.getElementById(id);
        if (el.innerText != val) {
          el.innerText = val;
        }
      }

      calculateBtn.addEventListener("click", () => {
        if (!dobInput.value) {
          statusMsg.innerText = "សូមបញ្ចូលថ្ងៃខែឆ្នាំកំណើតជាមុនសិន!";
          statusMsg.style.color = "#ef4444";
          return;
        }

        if (updateTimer) clearInterval(updateTimer);

        calculateAge();
        updateTimer = setInterval(calculateAge, 1000);
      });
    </script>
  </body>
</html>
